name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ]; then
            SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :abtesting:testDebugUnitTest --no-daemon

      - name: Compile Firebase provider
        run: ./gradlew :abtesting-firebase:compileDebugKotlin --no-daemon

      - name: Build sample app
        run: ./gradlew :sample:assembleDebug --no-daemon

      - name: Verify Maven Local publish
        run: >
          ./gradlew :abtesting:publishReleasePublicationToMavenLocal
          :abtesting-firebase:publishReleasePublicationToMavenLocal
          --no-configuration-cache --no-daemon
